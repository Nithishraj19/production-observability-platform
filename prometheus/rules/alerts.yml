groups:
  - name: infrastructure
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for 2 minutes."

      - alert: HighCPUUsage
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has exceeded 85% for 10 minutes."

      - alert: HighMemoryUsage
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has exceeded 90% for 10 minutes."

      - alert: HighDiskUsage
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} usage exceeded 85%."

  - name: application
    rules:
      - alert: ApplicationDown
        expr: up{job="demo-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Demo application is down"
          description: "The application metrics endpoint is not scrapeable."

      - alert: HighHTTPErrorRate
        expr: 100 * sum by (job) (rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum by (job) (rate(http_requests_total[5m])), 0.001) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate is high"
          description: "More than 5% of requests returned 5xx responses for 5 minutes."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Application p95 latency is high"
          description: "95th percentile request latency exceeded 1 second for 10 minutes."

  - name: kubernetes
    rules:
      - alert: KubernetesPodRestarts
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restart activity is elevated"
          description: "A container restarted more than 3 times in 15 minutes. Requires Kube State Metrics."
