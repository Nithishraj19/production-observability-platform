<svg xmlns="http://www.w3.org/2000/svg" width="1000px" height="1000px" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Production Observability Platform Architecture</title>
  <desc id="desc">Local and Kubernetes monitoring sources are scraped by Prometheus. Grafana queries Prometheus, which sends alerts to Alertmanager and notification receivers. AWS is an architecture reference only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8fc"/><stop offset="1" stop-color="#eaf1f8"/></linearGradient>
    <linearGradient id="prom" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9b63"/><stop offset="1" stop-color="#ed684d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324b" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52718e"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e4784f"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18324b}.title{font-size:38px;font-weight:700;letter-spacing:-.5px}.subtitle{font-size:17px;fill:#5d7489}.section{font-size:14px;font-weight:700;letter-spacing:1.1px;fill:#698198}.cardtitle{font-size:20px;font-weight:700}.body{font-size:15px;fill:#536b81}.small{font-size:13px;fill:#647c91}.pill{font-size:12px;font-weight:700;letter-spacing:.6px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="72" y="76" class="title">Production Observability Platform</text>
  <text x="74" y="108" class="subtitle">Metrics collection, visualization, and alert routing across infrastructure, containers, Kubernetes, and applications</text>

  <!-- collection boundary -->
  <rect x="64" y="160" width="730" height="672" rx="22" fill="#ffffff" stroke="#cfdae5" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="92" y="198" class="section">MONITORED SOURCES</text>
  <rect x="105" y="224" width="292" height="162" rx="16" fill="#f6f9fc" stroke="#d7e1eb"/>
  <circle cx="139" cy="260" r="17" fill="#dceaf6"/><path d="M132 261h14m-11-6v12m8-12v12" stroke="#3978a8" stroke-width="2" stroke-linecap="round"/>
  <text x="167" y="267" class="cardtitle">Linux hosts</text>
  <text x="128" y="306" class="body">CPU · memory · disk · network</text>
  <rect x="128" y="333" width="137" height="30" rx="15" fill="#e6f1fa"/><text x="146" y="353" class="pill" fill="#286b9d">NODE EXPORTER</text>

  <rect x="423" y="224" width="330" height="162" rx="16" fill="#f6f9fc" stroke="#d7e1eb"/>
  <circle cx="457" cy="260" r="17" fill="#e6e4f7"/><rect x="448" y="252" width="18" height="15" rx="3" fill="none" stroke="#6556a8" stroke-width="2"/><path d="M452 248v4m10-4v4" stroke="#6556a8" stroke-width="2"/>
  <text x="485" y="267" class="cardtitle">Docker containers</text>
  <text x="446" y="306" class="body">Usage · health · lifecycle</text>
  <rect x="446" y="333" width="111" height="30" rx="15" fill="#eeecfa"/><text x="463" y="353" class="pill" fill="#6556a8">cADVISOR</text>

  <rect x="105" y="410" width="292" height="174" rx="16" fill="#f6f9fc" stroke="#d7e1eb"/>
  <circle cx="139" cy="446" r="17" fill="#e1f2eb"/><path d="M130 446h18m-15-6h12m-12 12h12" stroke="#27805e" stroke-width="2" stroke-linecap="round"/>
  <text x="167" y="453" class="cardtitle">Kubernetes</text>
  <text x="128" y="492" class="body">Nodes · pods · deployments</text>
  <text x="128" y="516" class="body">Requests · limits · restarts</text>
  <rect x="128" y="538" width="199" height="28" rx="14" fill="#e6f3ed"/><text x="144" y="557" class="pill" fill="#27805e">KSM + NODE EXPORTER</text>

  <rect x="423" y="410" width="330" height="174" rx="16" fill="#f6f9fc" stroke="#d7e1eb"/>
  <circle cx="457" cy="446" r="17" fill="#fff0dc"/><path d="M448 451v-10l9-5 9 5v10l-9 5z" fill="none" stroke="#bc7927" stroke-width="2"/>
  <text x="485" y="453" class="cardtitle">Applications</text>
  <text x="446" y="492" class="body">Request rate · errors · latency</text>
  <text x="446" y="516" class="body">Health endpoint · custom metrics</text>
  <rect x="446" y="538" width="111" height="28" rx="14" fill="#fff0dc"/><text x="461" y="557" class="pill" fill="#a96518">/metrics</text>

  <rect x="105" y="608" width="648" height="177" rx="16" fill="#f8fafc" stroke="#d7e1eb"/>
  <rect x="128" y="632" width="182" height="28" rx="14" fill="#edf2f6"/><text x="146" y="651" class="pill" fill="#526b80">CLOUD REFERENCE ONLY</text>
  <text x="128" y="695" class="cardtitle">AWS services</text>
  <text x="128" y="725" class="body">EC2 · EKS · ALB / NLB · Auto Scaling · RDS · CloudWatch</text>
  <text x="128" y="755" class="small">Integration can use exporters or CloudWatch bridges; no AWS resources are provisioned.</text>

  <!-- central monitoring boundary -->
  <rect x="846" y="160" width="690" height="672" rx="22" fill="#ffffff" stroke="#cfdae5" stroke-width="2"/>
  <text x="876" y="198" class="section">OBSERVABILITY PLANE</text>
  <rect x="916" y="286" width="260" height="210" rx="22" fill="url(#prom)" filter="url(#shadow)"/>
  <circle cx="1046" cy="337" r="32" fill="#fff" fill-opacity=".2"/><path d="M1028 344c9-3 16-12 18-23 3 13 10 21 19 23-9 3-16 11-19 23-2-12-9-20-18-23z" fill="#fff"/>
  <text x="1046" y="406" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">Prometheus</text>
  <text x="1046" y="438" text-anchor="middle" font-size="15" fill="#fff">Scrape · store · evaluate rules</text>
  <text x="1046" y="465" text-anchor="middle" font-size="13" fill="#fff">PromQL · exporters · app metrics</text>

  <rect x="1272" y="226" width="214" height="136" rx="17" fill="#eaf3fb" stroke="#cbddec"/>
  <circle cx="1312" cy="267" r="17" fill="#d3e5f5"/><path d="M1303 270h18m-9-10v20m-6-13 6-7 6 7" fill="none" stroke="#3577a8" stroke-width="2"/>
  <text x="1340" y="274" class="cardtitle">Grafana</text>
  <text x="1294" y="312" class="body">Dashboards &amp; exploration</text>
  <text x="1294" y="337" class="small">Queries Prometheus</text>

  <rect x="1272" y="478" width="214" height="136" rx="17" fill="#fff2e6" stroke="#f0d4b7"/>
  <circle cx="1312" cy="519" r="17" fill="#f9dfc6"/><path d="M1304 513h16v13h-16z m4 17h8m-4-4v4" fill="none" stroke="#b87836" stroke-width="2"/>
  <text x="1340" y="526" class="cardtitle">Alertmanager</text>
  <text x="1294" y="564" class="body">Group · route · silence</text>
  <text x="1294" y="589" class="small">Receives firing alerts</text>

  <rect x="1272" y="686" width="214" height="94" rx="17" fill="#edf5f1" stroke="#d0e3d9"/>
  <circle cx="1312" cy="733" r="17" fill="#d9ece2"/><path d="m1304 733 6 6 11-13" fill="none" stroke="#35815e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1340" y="729" class="cardtitle">Receivers</text>
  <text x="1340" y="753" class="small">Slack · email · incident</text>

  <!-- flows -->
  <path d="M753 305h78q30 0 30 30v54h40" fill="none" stroke="#52718e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M753 496h88q20 0 20-20V390h55" fill="none" stroke="#52718e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M753 696h63q48 0 48-48V440q0-50 52-50" fill="none" stroke="#52718e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1176 337h92" fill="none" stroke="#52718e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1190" y="320" class="small">PromQL</text>
  <path d="M1176 445h42q26 0 26 26v53h28" fill="none" stroke="#e4784f" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="1190" y="472" class="small" fill="#b65d3a">Alert rules</text>
  <path d="M1379 614v62" fill="none" stroke="#52718e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1394" y="651" class="small">Route</text>
  <path d="M753 755h60q37 0 37-36V534q0-80 76-80h-30" fill="none" stroke="#8399ad" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="859" y="738" class="small">optional AWS metrics integration</text>

  <text x="72" y="894" class="small">LOCAL: Docker Compose demo stack</text>
  <text x="72" y="920" class="small">KUBERNETES: Prometheus + Grafana deployments; node-exporter + cAdvisor DaemonSets</text>
  <text x="72" y="964" class="small">Portfolio reference architecture · AWS is documentation only · No cloud resources are created</text>
</svg>
