apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: observability
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          securityContext:
            privileged: true
          ports:
            - name: metrics
              containerPort: 8080
          volumeMounts:
            - {name: rootfs, mountPath: /rootfs, readOnly: true}
            - {name: run, mountPath: /var/run, readOnly: true}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: docker, mountPath: /var/lib/docker, readOnly: true}
      volumes:
        - {name: rootfs, hostPath: {path: /}}
        - {name: run, hostPath: {path: /var/run}}
        - {name: sys, hostPath: {path: /sys}}
        - {name: docker, hostPath: {path: /var/lib/docker}}
